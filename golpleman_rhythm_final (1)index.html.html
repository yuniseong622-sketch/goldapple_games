    body {

    .pop { position: absolute; top: 12vh; right: 20px; font-size: 20px; padding: 8px 12px; border-radius: 8px; display: none; z-index: 100; font-weight: 700; }
    .pop.good { background: rgba(0,200,120,0.95); color: #001; }
    .pop.bad { background: rgba(255,80,80,0.95); color: #fff; }
    .hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.75); font-weight:600; }
  </style>

    const arrows = [document.getElementById("arrow1"), document.getElementById("arrow2"), document.getElementById("arrow3"), document.getElementById("arrow4")];
    const colors = ["#35c5ff", "#ff6fa3", "#7cff4f", "#ff5b4f", "#ffd166", "#b983ff"];
    const character = document.getElementById("character");
    const scoreDisplay = document.getElementById("score");
    let score = 0;
    let transformed = false;
    let activeArrow = null;
    let activeTimer = null;
    let spawnInterval = 1200; // ms between activations
    character.src = imgNormal;

    // popup element
    const pop = document.createElement('div');
    pop.className = 'pop';
    document.body.appendChild(pop);
    function showPop(text, kind='good') {
      pop.textContent = text;
      pop.className = 'pop ' + (kind === 'good' ? 'good' : 'bad');
      pop.style.display = 'block';
      pop.style.opacity = '1';
      pop.style.transform = 'translateY(0px)';
      setTimeout(()=>{ pop.style.opacity = '0'; pop.style.transform = 'translateY(-18px)'; }, 600);
      setTimeout(()=>{ pop.style.display = 'none'; }, 1100);
    }

    function activateRandomArrow() {
      // clear previous active
      if (activeArrow) { 
        // missed previous -> penalty
        activeArrow.style.backgroundColor = 'gray';
        activeArrow.classList.remove('active');
        activeArrow = null;
        score = Math.max(0, score - 10);
        scoreDisplay.textContent = "점수: " + score;
        showPop("-10", "bad");
      }
      arrows.forEach(a=>{ a.style.backgroundColor = 'gray'; a.classList.remove('active'); });
      const idx = Math.floor(Math.random() * arrows.length);
      activeArrow = arrows[idx];
      const color = colors[Math.floor(Math.random() * colors.length)];
      activeArrow.style.backgroundColor = color;
      activeArrow.classList.add('active');
      // set timer: if not hit within hitWindow ms, count as miss (but we handle miss on next activation)
      clearTimeout(activeTimer);
      activeTimer = setTimeout(()=>{ 
        // on timeout, we'll let next activation handle penalty (so do nothing here)
      }, spawnInterval - 10);
    }

    document.addEventListener('keydown', (e)=>{ 
      if (e.code === 'Space' || e.key === ' ') { 
        e.preventDefault();
        if (activeArrow) { 
          // hit
          score += 10;
          scoreDisplay.textContent = "점수: " + score;
          activeArrow.style.backgroundColor = 'gray';
          activeArrow.classList.remove('active');
          activeArrow = null;
          clearTimeout(activeTimer);
          showPop("+10", "good");
          if (score >= 50 && !transformed) { 
            character.src = imgTransformed;
            transformed = true;
            character.style.transform = 'scale(1.18)';
          }
        } else { 
          // pressing space when no active note -> do nothing (no penalty)
        }
      }
    });

    // start loop
    activateRandomArrow();
    setInterval(activateRandomArrow, spawnInterval);
  </script>
